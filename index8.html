<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores lógicos || (o) en las estructuras condicionales.</title>
</head>
<body>
    <script>
        let día = parseFloat(prompt('Ingrese el día:'));
        let mes = parseFloat(prompt('Ingrese el mes:'));
        let año = parseFloat(prompt('Ingrese el año:'));
        if (mes == 1 || mes == 2 || mes == 3) {
            document.write('Estamos en el primer trimestre del año.');
        }
        if (mes == 4 || mes == 5 || mes == 6) {
            document.write('Estamos en el segundo trimestre del año.');
        }
        if (mes == 7 || mes == 8 || mes == 9) {
            document.write('Estamos en el tercer trimestre del año.');
        }
    </script>

</body>
</html>

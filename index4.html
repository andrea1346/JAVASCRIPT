<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de JavaScript</title>
</head>
<body>
    <script>
        let numero1 = prompt('Ingrese el número1:');
        let numero2 = prompt('Ingrese el número2');
        document.write("<br>Numero1: " + numero1);
        document.write("<br>Numero2: " + numero2);

        let suma = parseInt(numero1) + parseInt(numero2);
        let producto = parseInt(numero1) * parseInt(numero2);
        document.write('<br>La suma es: ' + suma);
        document.write('<br>El producto es: + producto ');
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema 2</title>
</head>
<body>
    <script>
        let clave1 = parseFloat(prompt('Ingrese la Primera clave:'));
        let clave2 = parseFloat(prompt('Ingrese la segunda clave:'));

        if (clave1 == clave2) {
            document.write('Claves ingresadas correctamente');
        }
        if (clave1 != clave2) {
            document.write('Claves no coinciden');
        }
    </script>
</body>
</html>
